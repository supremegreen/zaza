<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mobile Video Background</title>

    <style>
      /* RESET */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      body {
        width: 100%;
        min-height: 100vh;
        background: #000;
        overflow-x: hidden;
      }

      /* VIDEO BACKGROUND */
      .video-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        overflow: hidden;
      }

      .video-bg video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      /* WRAPPER TO ALLOW SCROLLING IF MULTIPLE CARDS EXIST */
      .content-wrapper {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 40px;
      }

      /* CARD / OVERLAY SECTION */
      .overlay {
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      /* CENTER IMAGE */
      .center-image {
        width: 100%;
        max-width: 360px;
        height: auto;
        margin-bottom: 20px;
        border-radius: 12px;
        object-fit: contain;
      }

      /* TEXT BOX */
      .text-box {
        width: 100%;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: #ffffff;
        padding: 20px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .text-box h1 {
        font-size: 22px;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }

      .text-box p {
        font-size: 16px;
        line-height: 1.5;
        font-weight: 500;
      }
    </style>
  </head>

  <body>
    <!-- VIDEO BACKGROUND -->
    <div class="video-bg">
      <video autoplay muted playsinline loop preload="auto">
        <source src="images/bgsmoke.mp4" type="video/mp4" />
      </video>
    </div>

    <!-- MAIN SCROLLABLE CONTENT -->
    <main class="content-wrapper">
      <!-- ITEM 1 -->
      <section class="overlay">
        <img src="images/invaded.png" alt="Invaded" class="center-image" />
        <div class="text-box">
          <h1>478-765-5118</h1>
          <p>3.5s $15 / 7's $30 / Half's $60 / Zips $100</p>
        </div>
      </section>

      <!-- ITEM 2 -->
      <section class="overlay">
        <img src="images/candy.png" alt="Candy" class="center-image" />
        <div class="text-box">
          <h1>478-765-5118</h1>
          <p>3.5s $20 / 7's $40 / Half's $70 / Zips $130</p>
        </div>
      </section>
    </main>

    <!-- BACKUP LOOP SCRIPT FOR OLDER MOBILE BROWSERS -->
    <script>
      const video = document.querySelector('.video-bg video');
      if (video) {
        video.addEventListener('ended', () => {
          video.currentTime = 0;
          video.play();
        });
      }
    </script>
  </body>
</html>
